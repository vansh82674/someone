services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: someone_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: someone_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      # - DATABASE_URL=your_supabase_connection_string_here
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: someone_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
